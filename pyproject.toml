[project]
name = "ko-copycheck"
version = "0.1.1"
description = "Offline plagiarism checker for Korean prose submissions: verbatim winnowing plus paraphrase sentence similarity, static HTML report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "LeeGyeongPil" }]
keywords = ["plagiarism", "korean", "winnowing", "similarity", "hwpx", "docx", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]
dependencies = [
  "python-docx==1.2.0",
  "pypdf==7.0.0",
]

[project.scripts]
ko-copycheck = "ko_copycheck.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
